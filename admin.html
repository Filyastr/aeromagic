  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

iv style=\"background:#FFFFFF;border-radius:24px;padding:30px;box-shadow:0 3px 16px rgba(83,56,74,0.10)\">\n    <h1 style=\"margin:0 0 8px;font-family:'Comfortaa',sans-serif;font-size:22px\">Вхід в адмінку<\u002Fh1>\n    <p style=\"margin:0 0 18px;font-size:14.5px;color:#6F5468;line-height:1.55\">Пароль задається у Cloudflare як змінна ADMIN_PASSWORD.<\u002Fp>\n    <input value=\"{{ pwd }}\" sc-camel-on-change=\"{{ onPwd }}\" sc-camel-on-key-down=\"{{ onPwdKey }}\" type=\"password\" placeholder=\"Пароль\" aria-label=\"Пароль\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:2px solid #FFD9EA;border-radius:14px;font-size:15px;margin-bottom:12px\">\n    <button sc-camel-on-click=\"{{ login }}\" style=\"width:100%;background:#E8478D;color:#FFFFFF;border:none;border-radius:20px;padding:13px;font-weight:800;font-size:15.5px;cursor:pointer;min-height:48px\" style-hover=\"background:#B92F6B\">Увійти<\u002Fbutton>\n    <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:12px 0 0;color:#B92F6B;font-size:14px;font-weight:700\">{{ error }}<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ loggedIn }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"max-width:1280px;margin:0 auto;padding:22px 20px 80px\">\n  <div role=\"tablist\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"background:#FFE3EE;border:2px solid #FFB4D3;border-radius:16px;padding:12px 16px;color:#B92F6B;font-size:14.5px;font-weight:700;margin:0 0 16px\">{{ error }}<\u002Fp>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasNotice }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"background:#DDF3E9;border:2px solid #9FD9C2;border-radius:16px;padding:12px 16px;color:#1E6A50;font-size:14.5px;font-weight:700;margin:0 0 16px\">{{ notice }}<\u002Fp>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tabProducts }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"Товари\">\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px\">\n      <button sc-camel-on-click=\"{{ addProduct }}\" style=\"background:#E8478D;color:#FFFFFF;border:none;border-radius:20px;padding:11px 20px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px\" style-hover=\"background:#B92F6B\">+ Додати товар<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ saveProducts }}\" style=\"background:#0E9F8A;color:#FFFFFF;border:none;border-radius:20px;padding:11px 20px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px\" style-hover=\"background:#0B7E6E\">Зберегти зміни<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportProducts }}\" style=\"background:#FFFFFF;border:2px solid #FFD9EA;border-radius:20px;padding:10px 18px;font-weight:800;font-size:14px;color:#53384A;cursor:pointer;min-height:44px\" style-hover=\"border-color:#FF7BB5\">Завантажити products.json<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleImport }}\" style=\"background:#FFFFFF;border:2px solid #FFD9EA;border-radius:20px;padding:10px 18px;font-weight:800;font-size:14px;color:#53384A;cursor:pointer;min-height:44px\" style-hover=\"border-color:#FF7BB5\">Імпорт списком<\u002Fbutton>\n      <span style=\"font-size:14px;color:#6F5468;font-weight:700\">Товарів: {{ productCount }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ importOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#FFFFFF;border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 3px 16px rgba(83,56,74,0.09)\">\n        <p style=\"margin:0 0 8px;font-size:14.5px;color:#6F5468;line-height:1.6\">Вставте рядки у форматі <b>Назва; ціна; катег c.key }}\">{{ c.title }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ p.badge }}\" sc-camel-on-change=\"{{ p.onBadge }}\" aria-label=\"Бейдж\" style=\"flex:0 1 130px;box-sizing:border-box;padding:10px 10px;border:2px solid #FFD9EA;border-radius:12px;font-size:13.5px;font-weight:700;background:#FFFFFF\">\n            <option value=\"\">без бейджа<\u002Foption>\n            <option value=\"Хіт\">Хіт<\u002Foption>\n            <option value=\"Новинка\">Новинка<\u002Foption>\n            <option value=\"-10%\">-10%<\u002Foption>\n          <\u002Fsc-raw-select>\n          <label style=\"display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#6F5468;min-height:44px\">\n            <input type=\"checkbox\" checked=\"{{ p.stock }}\" sc-camel-on-change=\"{{ p.onStock }}\" style=\"width:18px;height:18px;accent-color:#0E9F8A\">Є\n          <\u002Flabel>\n          <div style=\"display:flex;gap:6px;margin-left:auto\">\n            <button sc-camel-on-click=\"{{ p.editImg }}\" aria-label=\"Змінити фото\" title=\"Фото\" style=\"background:#FFFFFF;border:2px solid #FFD9EA;border-radius:12px;width:44px;height:44px;font-size:16px;cursor:pointer\">🖼<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ p.duplicate }}\" aria-label=\"Дублювати\" title=\"Дублювати\" style=\"background:#FFFFFF;border:2px solid #FFD9EA;border-radius:12px;width:44px;height:44px;font-size:16px;cursor:pointer\">⧉<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ p.remove }}\" aria-label=\"Видалити\" title=\"Видалити\" style=\"background:#FFE3EE;border:2px solid #FFB4D3;border-radius:12px;width:44px;height:44px;font-size:16px;color:#B92F6B;cursor:pointer\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tabOrders }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Замовлення\">\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px\">\n      <button sc-camel-on-click=\"{{ reloadOrders }}\" style=\"background:#FFFFFF;border:2px solid #FFD9EA;border-radius:20px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px\">Оновити<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportOrders }}\" style=\"background:#0E9F8A;color:#FFFFFF;border:none;border-radius:20px;padding:11px 20px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px\">Вивантажити CSV<\u002Fbutton>\n      <span style=\"font-size:14px;color:#6F5468;font-weight:700\">Записів: {{ orderCount }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <sc-for list=\"{{ orders }}\" as=\"o\" hint-placeholder-count=\"0\">\n        <div style=\"background:#FFFFFF;border-radius:18px;padding:16px 18px;box-shadow:0 3px 14px rgba(83,56,74,0.08);display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start\">\n          <div style=\"min-width:150px\">\n            <p style=\"margin:0 0 4px;font-weight:800;font-size:15px;color:#E8478D\">{{ o.orderNo }}<\u002Fp>\n            <p style=\"margin:0;font-size:13px;color:#6F5468\">{{ o.date }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width:200px\">\n            <p style=\"margin:0 0 4px;font-weight:700;font-size:14.5px\">{{ o.name }}<\u002Fp>\n            <p style=\"margin:0;font-size:13.5px;color:#6F5468\">{{ o.phone }} · {{ o.email }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:220px\">\n            <p style=\"margin:0 0 4px;font-size:13.5px;line-height:1.5;color:#53384A\">{{ o.itemsStr }}<\u002Fp>\n            <p style=\"margin:0;font-size:13px;color:#6F5468\">{{ o.meta }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:right\">\n            <p style=\"margin:0 0 8px;font-weight:800;font-size:17px;color:#53384A\">{{ o.amountStr }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ o.remove }}\" style=\"background:#FFE3EE;border:2px solid #FFB4D3;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:800;color:#B92F6B;cursor:pointer;min-height:40px\">Видалити<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tabClients }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Клієнти\">\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px\">\n      <button sc-camel-on-click=\"{{ reloadClients }}\" style=\"background:#FFFFFF;border:2px solid #FFD9EA;border-radius:20px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px\">Оновити<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportClients }}\" style=\"background:#0E9F8A;color:#FFFFFF;border:none;border-radius:20px;padding:11px 20px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px\">Вивантажити CSV<\u002Fbutton>\n      <span style=\"font-size:14px;color:#6F5468;font-weight:700\">Клієнтів: {{ clientCount }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:18px;padding:8px 4px;box-shadow:0 3px 14px rgba(83,56,74,0.08)\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) 150px minmax(0,1.4fr) 110px 130px 150px;gap:10px;padding:12px 16px;font-size:12.5px;font-weight:800;color:#6F5468;text-transform:uppercase;letter-spacing:0.6px\">\n        <span>Клієнт<\u002Fspan><span>Телефон<\u002Fspan><span>Email<\u002Fspan><span>Замовлень<\u002Fspan><span>Сума<\u002Fspan><span>Останнє<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ clients }}\" as=\"c\" hint-placeholder-count=\"0\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) 150px minmax(0,1.4fr) 110px 130px 150px;gap:10px;padding:12px 16px;border-top:1px solid #F5E4EE;font-size:14px;align-items:center\">\n          <span style=\"font-weight:700\">{{ c.name }}<\u002Fspan>\n          <a href=\"{{ c.tel }}\" style=\"font-weight:700\">{{ c.phone }}<\u002Fa>\n          <span style=\"overflow:hidden;text-overflow:ellipsis\">{{ c.email }}<\u002Fspan>\n          <span>{{ c.ordersCount }}<\u002Fspan>\n          <span style=\"font-weight:800;color:#E8478D\">{{ c.totalStr }}<\u002Fspan>\n          <span style=\"color:#6F5468;font-size:13px\">{{ c.last }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n<\u002Fmain>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      pwd: '', token: '', tab: 'products',\n      products: [], orders: [], clients: [],\n      error: '', notice: '', importOpen: false, importText: '', loading: false\n    };\n  }\n\n  componentDidMount() {\n    let t = '';\n    try { t = sessionStorage.getItem('aeromagic_admin') || ''; } catch (e) {}\n    if (t) { this.setState({ token: t }); this.loadAll(t); }\n  }\n\n  headers(token) {\n    return { 'Content-Type': 'application/json', 'X-Admin-Password': token || this.state.token };\n  }\n\n  flash(notice) {\n    this.setState({ notice, error: '' });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ notice: '' }), 3000);\n  }\n\n  login() {\n    const t = this.state.pwd;\n    if (!t) return this.setState({ error: 'Введіть пароль' });\n    fetch('/api/orders?view=clients', { headers: this.headers(t) })\n      .then(r => r.ok ? r.json() : r.json().then(d => Promise.reject(new Error(d.error || 'Помилка входу'))))\n      .then(() => {\n        try { sessionStorage.setItem('aeromagic_admin', t); } catch (e) {}\n        this.setState({ token: t, pwd: '', error: '' });\n        this.loadAll(t);\n      })\n      .catch(e => this.setState({ error: e.message }));\n  }\n\n  logout() {\n    try { sessionStorage.removeItem('aeromagic_admin'); } catch (e) {}\n    this.setState({ token: '', products: [], orders: [], clients: [] });\n  }\n\n  loadAll(token) {\n    this.loadProducts();\n    this.loadOrders(token);\n    this.loadClients(token);\n  }\n\n  loadProducts() {\n    const fail = () => fetch('products.json', { cache: 'no-cache' }).then(r => r.json());\n    fetch('/api/products', { cache: 'no-cache' })\n      .then(r => r.ok ? r.json() : Promise.reject(new Error('api')))\n      .catch(fail)\n      .then(d => this.setState({ products: (d && d.items) || [] }))\n      .catch(() => this.setState({ error: 'Не вдалося завантажити товари' }));\n  }\n\n  loadOrders(token) {\n    fetch('/api/orders', { headers: this.headers(token) })\n      .then(r => r.json())\n      .then(d => this.setState({ orders: d.orders || [], error: d.error || '' }))\n      .catch(() => this.setState({ error: 'Замовлення недоступні' }));\n  }\n\n  loadClients(token) {\n    fetch('/api/orders?view=clients', { headers: this.headers(token) })\n      .then(r => r.json())\n      .then(d => this.setState({ clients: d.clients || [], error: d.error || '' }))\n      .catch(() => this.setState({ error: 'База клієнтів недоступна' }));\n  }\n\n  setProducts(products) { this.setState({ products }); }\n\n  patch(i, field, value) {\n    const products = this.state.products.slice();\n    products[i] = Object.assign({}, products[i], { [field]: value });\n    this.setProducts(products);\n  }\n\n  nextId() {\n    return this.state.products.reduce((a, p) => Math.max(a, Number(p.id) || 0), 0) + 1;\n  }\n\n  addProduct() {\n    this.setProducts([{ id: this.nextId(), name: 'Новий товар', price: 100, cat: 'sets', badge: 'Новинка', rating: 50, stock: true, img: '' }].concat(this.state.products));\n  }\n\n  saveProducts() {\n    fetch('/api/products', {\n      method: 'PUT',\n      headers: this.headers(),\n      body: JSON.stringify({ items: this.state.products })\n    })\n      .then(r => r.json())\n      .then(d => d.error ? this.setState({ error: d.error }) : this.flash('Збережено: ' + d.count + ' товарів. Сайт оновиться одразу.'))\n      .catch(() => this.setState({ error: 'Не вдалося зберегти' }));\n  }\n\n  exportProducts() {\n    const blob = new Blob([JSON.stringify({ items: this.state.products }, null, 2)], { type: 'application/json' });\n    this.download(URL.createObjectURL(blob), 'products.json');\n  }\n\n  download(url, filename) {\n    const a = document.createElement('a');\n    a.href = url; a.download = filename;\n    document.body.appendChild(a); a.click(); a.remove();\n  }\n\n  exportCsv(view, filename) {\n    fetch('/api/orders?format=csv' + (view ? '&view=' + view : ''), { headers: this.headers() })\n      .then(r => r.blob())\n      .then(b => this.download(URL.createObjectURL(b), filename))\n      .catch(() => this.setState({ error: 'Не вдалося вивантажити' }));\n  }\n\n  runImport() {\n    const txt = this.state.importText.trim();\n    if (!txt) return;\n    let added = [];\n    if (txt.charAt(0) === '{' || txt.charAt(0) === '[') {\n      try {\n        const parsed = JSON.parse(txt);\n        added = Array.isArray(parsed) ? parsed : (parsed.items || []);\n      } catch (e) { return this.setState({ error: 'JSON не розпізнано' }); }\n    } else {\n      added = txt.split(/\\n+/).map(line => {\n        const c = line.split(';').map(s => s.trim());\n        if (!c[0]) return null;\n        return { name: c[0], price: Number(c[1]) || 0, cat: c[2] || 'sets', img: c[3] || '', badge: '', rating: 50, stock: true };\n      }).filter(Boolean);\n    }\n    let id = this.nextId();\n    added = added.map(p => Object.assign({ badge: '', rating: 50, stock: true, img: '' }, p, { id: Number(p.id) || id++ }));\n    this.setState({ products: added.concat(this.state.products), importText: '', importOpen: false });\n    this.flash('Додано ' + added.length + ' — натисніть «Зберегти зміни».');\n  }\n\n  hrn(n) { return new Intl.NumberFormat('uk-UA').format(n) + ' грн'; }\n\n  dt(iso) {\n    if (!iso) return '';\n    const d = new Date(iso);\n    return isNaN(d) ? iso : d.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });\n  }\n\n  removeOrder(o) {\n    const key = 'order:' + o.createdAt + ':' + o.orderNo;\n    fetch('/api/orders?key=' + encodeURIComponent(key), { method: 'DELETE', headers: this.headers() })\n      .then(() => this.loadOrders())\n      .catch(() => this.setState({ error: 'Не вдалося видалити' }));\n  }\n\n  cats() {\n    return [\n      { key: 'latex-plain', title: 'Латекс однотонні' },\n      { key: 'latex-print', title: 'Латекс з малюнком' },\n      { key: 'foil-figures', title: 'Фольговані фігури' },\n      { key: 'foil-numbers', title: 'Цифри та літери' },\n      { key: 'bouquets', title: 'Букети' },\n      { key: 'sets', title: 'Набори та оформлення' },\n      { key: 'confetti', title: 'З конфеті' },\n      { key: 'chrome', title: 'Хром і металік' },\n      { key: 'gender', title: 'Гендер-паті' },\n      { key: 'accessories', title: 'Аксесуари та гелій' }\n    ];\n  }\n\n  renderVals() {\n    const s = this.state;\n    const tabs = [\n      { key: 'products', label: 'Товари' },\n      { key: 'orders', label: 'Замовлення' },\n      { key: 'clients', label: 'Клієнти' }\n    ];\n    return {\n      loggedIn: !!s.token, loggedOut: !s.token,\n      statusText: s.token ? 'товари, замовлення та база клієнтів' : 'доступ лише за паролем',\n      pwd: s.pwd,\n      onPwd: e => this.setState({ pwd: e.target.value }),\n      onPwdKey: e => { if (e.key === 'Enter') this.login(); },\n      login: () => this.login(),\n      logout: () => this.logout(),\n      error: s.error, hasError: !!s.error,\n      notice: s.notice, hasNotice: !!s.notice,\n      tabs: tabs.map(t => ({\n        label: t.label,\n        select: () => this.setState({ tab: t.key }),\n        style: 'border:2px solid ' + (s.tab === t.key ? '#E8478D' : '#FFD9EA') + ';background:' + (s.tab === t.key ? '#E8478D' : '#FFFFFF') + ';color:' + (s.tab === t.key ? '#FFFFFF' : '#53384A') + ';border-radius:20px;padding:10px 22px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px'\n      })),\n      tabProducts: s.tab === 'products', tabOrders: s.tab === 'orders', tabClients: s.tab === 'clients',\n      catOptions: this.cats(),\n      productCount: s.products.length,\n      products: s.products.map((p, i) => ({\n        name: p.name, price: p.price, cat: p.cat, badge: p.badge || '', stock: !!p.stock,\n        thumb: React.createElement('img', {\n          src: p.img || 'data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"64\" height=\"64\"><rect width=\"64\" height=\"64\" fill=\"%23FFEFF6\"/><\u002Fsvg>',\n          alt: '', style: { width: '64px', height: '64px', objectFit: 'cover', borderRadius: '12px', background: '#FFEFF6' }\n        }),\n        onName: e => this.patch(i, 'name', String(e.target.value).replace(/[<>]/g, '').slice(0, 200)),\n        onPrice: e => this.patch(i, 'price', Math.max(0, Math.min(999999, Math.round(Number(String(e.target.value).replace(/[^\\d]/g, '')) || 0)))),\n        onCat: e => this.patch(i, 'cat', e.target.value),\n        onBadge: e => this.patch(i, 'badge', e.target.value),\n        onStock: e => this.patch(i, 'stock', e.target.checked),\n        editImg: () => {\n          const url = window.prompt('Посилання на фото товару (https://…):', p.img || '');\n          if (url === null) return;\n          const v = url.trim();\n          if (v && !/^https?:\\/\\/\\S+\\.(jpe?g|png|webp|gif|avif)(\\?\\S*)?$/i.test(v)) {\n            return this.setState({ error: 'Посилання має починатись з https:// і вести на файл .jpg, .png або .webp' });\n          }\n          this.patch(i, 'img', v);\n          this.setState({ error: '' });\n        },\n        duplicate: () => {\n          const products = s.products.slice();\n          products.splice(i + 1, 0, Object.assign({}, p, { id: this.nextId(), name: p.name + ' (копія)' }));\n          this.setProducts(products);\n        },\n        remove: () => {\n          if (!window.confirm('Видалити «' + p.name + '»?')) return;\n          this.setProducts(s.products.filter((_, j) => j !== i));\n        }\n      })),\n      addProduct: () => this.addProduct(),\n      saveProducts: () => this.saveProducts(),\n      exportProducts: () => this.exportProducts(),\n      toggleImport: () => this.setState({ importOpen: !s.importOpen }),\n      importOpen: s.importOpen,\n      importText: s.importText,\n      onImportText: e => this.setState({ importText: e.target.value }),\n      runImport: () => this.runImport(),\n      orderCount: s.orders.length,\n      orders: s.orders.map(o => ({\n        orderNo: o.orderNo,\n        date: this.dt(o.createdAt),\n        name: (o.client && o.client.name) || '—',\n        phone: (o.client && o.client.phone) || '',\n        email: (o.client && o.client.email) || 'без email',\n        itemsStr: (o.items || []).map(i => i.name + ' × ' + i.qty).join('; ') || 'Заявка на дзвінок',\n        meta: [o.delivery, o.payment, o.address, o.note].filter(Boolean).join(' · '),\n        amountStr: o.amount ? this.hrn(o.amount) : '—',\n        remove: () => this.removeOrder(o)\n      })),\n      reloadOrders: () => this.loadOrders(),\n      exportOrders: () => this.exportCsv('', 'orders.csv'),\n      clientCount: s.clients.length,\n      clients: s.clients.map(c => ({\n        name: c.name || '—', phone: c.phone, tel: 'tel:' + c.phone,\n        email: c.email || '—',\n        ordersCount: c.ordersCount || 0,\n        totalStr: this.hrn(c.totalSpent || 0),\n        last: this.dt(c.lastOrderAt)\n      })),\n      reloadClients: () => this.loadClients(),\n      exportClients: () => this.exportCsv('clients', 'clients.csv')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
