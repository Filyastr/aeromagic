    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own

      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ovary\" data-screen-label=\"Хіти продажів\" style=\"padding:56px 20px 72px;background:#FFEFF6;scroll-margin-top:120px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:24px\">\n      <span style=\"display:inline-block;background:#BFEBD5;color:#53384A;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;padding:6px 16px;border-radius:999px\">bestsellers<\u002Fspan>\n      <h2 style=\"margin:0;display:inline-block;background:#FF7BB5;color:#FFFFFF;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);padding:10px 26px;border-radius:999px\">Хіти продажів<\u002Fh2>\n      <p style=\"margin:4px 0 0;color:#6F5468;font-size:16px\">Те, що найчастіше замовляють цього місяця по всій Україні<\u002Fp>\n    <\u002Fdiv>\n    <div role=\"tablist\" aria-label=\"Фільтр товарів\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px\">\n      <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n        <button role=\"tab\" aria-selected=\"{{ tab.active }}\" sc-camel-on-click=\"{{ tab.pick }}\" style=\"border:2px dashed {{ tab.border }};background:{{ tab.bg }};color:{{ tab.color }};border-radius:22px;padding:9px 20px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px\">{{ tab.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasProducts }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px\">\n      <sc-for list=\"{{ products }}\" as=\"item\" hint-placeholder-count=\"8\">\n        <article style=\"background:#FFFFFF;border-radius:22px;box-shadow:0 3px 16px rgba(83,56,74,0.09);overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"position:relative;height:200px;background:#FFEFF6\">\n            <img src=\"{{ item.img }}\" alt=\"{{ item.name }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n            <sc-if value=\"{{ item.hasBadge }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"position:absolute;top:12px;left:12px;background:{{ item.badgeBg }};color:{{ item.badgeColor }};font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px\">{{ item.badge }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px 8px\">\n            <h3 style=\"margin:0;font-size:15.5px;line-height:1.4;font-weight:700;color:#53384A;min-height:44px\">{{ item.name }}<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"position:relative;border-top:2px dashed #F5CFE0;margin:8px 0 0\">\n            <span aria-hidden=\"true\" style=\"position:absolute;left:-9px;top:-9px;width:18px;height:18px;background:#FFEFF6;border-radius:50%\"><\u002Fspan>\n            <span aria-hidden=\"true\" style=\"position:absolute;right:-9px;top:-9px;width:18px;height:18px;background:#FFEFF6;border-radius:50%\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:12px 18px 18px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <span style=\"font-size:21px;font-weight:800;color:#E8478D\">{{ item.priceStr }}<\u002Fspan>\n              <sc-if value=\"{{ item.hasOld }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:14px;color:#7A6072;text-decoration:line-through\">{{ item.oldStr }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ item.add }}\" style=\"background:#FF7BB5;color:#FFFFFF;border:none;border-radius:24px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;min-height:44px\" style-hover=\"background:#E8478D\">У кошик 🤍<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noProducts }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"padding:36px 0;color:#6F5468;font-size:16px\">Нічого не знайшли за запитом «{{ search }}». Спробуйте іншу назву або зателефонуйте нам — підберемо разом.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Акція\" style=\"padding:0 20px 72px;background:#FFEFF6\">\n  <div style=\"max-width:1180px;margin:0 auto;background:#FFFFFF;border-radius:28px;padding:40px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;box-shadow:0 3px 16px rgba(83,56,74,0.09)\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:10px\">\n      <span style=\"display:inline-block;background:#BFEBD5;color:#53384A;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:16px;padding:8px 22px;border-radius:999px;letter-spacing:2px;text-transform:uppercase\">Sale<\u002Fspan>\n      <p style=\"margin:0;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:clamp(22px,3vw,32px);color:#E8478D;line-height:1.2\">−10% на готові набори<br>при замовленні від 1000 грн<\u002Fp>\n      <p style=\"margin:0;color:#6F5468;font-size:15px\">Промокод не потрібен — знижку врахує менеджер при підтвердженні.<\u002Fp>\n    <\u002Fdiv>\n    <a href=\"katalog.html\" style=\"display:inline-flex;align-items:center;gap:8px;background:#E8478D;color:#FFFFFF;font-weight:800;font-size:16px;padding:14px 32px;border-radius:28px;box-shadow:0 10px 26px rgba(232,71,141,0.35)\" style-hover=\"background:#B92F6B;color:#FFFFFF\">Дивитися набори →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"nabory\" data-screen-label=\"Свято під ключ\" style=\"padding:72px 20px;scroll-margin-top:120px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:28px\">\n      <span style=\"display:inline-block;background:#BBD8F7;color:#3A4B6B;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;padding:6px 16px;border-radius:999px\">будь-який привід<\u002Fspan>\n      <h2 style=\"margin:0;display:inline-block;background:#FFD9EA;color:#B92F6B;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);padding:10px 26px;border-radius:999px\">Свято під ключ<\u002Fh2>\n      <p style=\"margin:4px 0 0;color:#6F5468;font-size:16px\">Готові добірки за подіями — скажіть привід, решту зробимо ми<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <sc-for list=\"{{ events }}\" as=\"ev\" hint-placeholder-count=\"7\">\n        <a href=\"#zamovlennya\" style=\"display:inline-flex;align-items:center;background:#FFFFFF;border:2px dashed {{ ev.border }};border-radius:26px;padding:12px 22px;font-weight:800;font-size:15px;color:#53384A;min-height:44px;box-sizing:border-box\" style-hover=\"background:{{ ev.hoverBg }};color:#53384A\">{{ ev.name }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div aria-hidden=\"true\" style=\"height:26px;background:#FFF7EE;background-image:radial-gradient(circle at 14px 26px,#FF9CC6 14px,transparent 15px);background-size:28px 26px;background-repeat:repeat-x\"><\u002Fdiv>\n\n<section id=\"perevahy\" data-screen-label=\"Чому обирають\" style=\"padding:56px 20px 72px;background:linear-gradient(170deg,#FF9CC6 0%,#FF7BB5 100%);scroll-margin-top:120px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:28px\">\n      <span style=\"display:inline-block;background:#BFEBD5;color:#53384A;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;padding:6px 16px;border-radius:999px\">чому ми<\u002Fspan>\n      <h2 style=\"margin:0;display:inline-block;background:#FFFFFF;color:#E8478D;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);padding:10px 26px;border-radius:999px\">Чому обирають Aeromagic<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:34px\">\n      <div style=\"background:rgba(255,255,255,0.22);border-radius:20px;padding:20px;text-align:center\">\n        <p style=\"margin:0;font-family:'Comfortaa',sans-serif;font-size:34px;font-weight:700;color:#FFFFFF\">16<\u002Fp>\n        <p style=\"margin:4px 0 0;font-size:14px;color:#FFFFFF;font-weight:800\">років досвіду з кульками<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.22);border-radius:20px;padding:20px;text-align:center\">\n        <p style=\"margin:0;font-family:'Comfortaa',sans-serif;font-size:34px;font-weight:700;color:#FFFFFF\">8500+<\u002Fp>\n        <p style=\"margin:4px 0 0;font-size:14px;color:#FFFFFF;font-weight:800\">задоволених клієнтів<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.22);border-radius:20px;padding:20px;text-align:center\">\n        <p style=\"margin:0;font-family:'Comfortaa',sans-serif;font-size:34px;font-weight:700;color:#FFFFFF\">24/7<\u002Fp>\n        <p style=\"margin:4px 0 0;font-size:14px;color:#FFFFFF;font-weight:800\">приймаємо замовлення<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.22);border-radius:20px;padding:20px;text-align:center\">\n        <p style=\"margin:0;font-family:'Comfortaa',sans-serif;font-size:34px;font-weight:700;color:#FFFFFF\">3–7<\u002Fp>\n        <p style=\"margin:4px 0 0;font-size:14px;color:#FFFFFF;font-weight:800\">діб літають наші кульки<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px\">\n      <div style=\"background:#FFFFFF;border:2px dashed #FF7BB5;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:#FFD9EA;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8478D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"8\" rx=\"6\" ry=\"7\"><\u002Fellipse><path d=\"M12 17c-1.5 2 1.5 3 0 5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"margin:0;font-size:16px;font-weight:800;color:#53384A\">Політ 3–7 діб<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#6F5468\">Обробляємо латексні кульки Hi-Float, тож вони радують значно довше за звичайні.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:2px dashed #5FAE8C;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:#DDF3E9;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E6A50\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3.5 2\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"margin:0;font-size:16px;font-weight:800;color:#53384A\">Доставка по всій Україні<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#6F5468\">Надсилаємо набори з балоном гелію Новою Поштою у будь-яке місто. По Києву — курʼєр до дверей точно до години, навіть уранці.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:2px dashed #7FA8DC;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:#DCEAFB;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A7DBD\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20l3-0.8L19.5 6.7a1.8 1.8 0 0 0-2.5-2.5L4.8 16.7 4 20z\"><\u002Fpath><path d=\"M14 6l3.5 3.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"margin:0;font-size:16px;font-weight:800;color:#53384A\">Індивідуальні написи<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#6F5468\">Нанесемо імʼя, вітання чи жарт на кульки — зробимо подарунок особистим.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:2px dashed #FF7BB5;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:#FFD9EA;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8478D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"margin:0;font-size:16px;font-weight:800;color:#53384A\">Безпечні матеріали<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#6F5468\">Латекс і фольга європейських та американських виробників — безпечно для дітей і тварин.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:2px dashed #5FAE8C;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:52px;height:52px;border-radius:50%;background:#DDF3E9;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"#1E6A50\" aria-hidden=\"true\"><path d=\"M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z\"><\u002Fpath><path d=\"M19 15l0.9 3.1L23 19l-3.1 0.9L19 23l-0.9-3.1L15 19l3.1-0.9L19 15z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"margin:0;font-size:16px;font-weight:800;color:#53384A\">Оформлення під ключ — Київ<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#6F5468\">Фотозони, арки, декор залів і магазинів — від ідеї до монтажу й демонтажу. Виїзд лише в межах Києва та області.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Доставка по районах\" style=\"padding:56px 20px;background:#FFEFF6\">\n  <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px\">\n    <span style=\"display:inline-block;background:#BFEBD5;color:#53384A;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;padding:6px 16px;border-radius:999px\">доставка<\u002Fspan>\n    <h2 style=\"margin:0 0 6px;display:inline-block;background:#FFFFFF;color:#E8478D;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);padding:10px 26px;border-radius:999px\">Доставка по всій Україні та по Києву<\u002Fh2>\n    <p style=\"margin:0 0 18px;color:#6F5468;font-size:15.5px;line-height:1.6;max-width:760px\">Набори з балоном гелію відправляємо Новою Поштою у будь-яке місто України — кульки надуєте самі, інструкція всередині. По Києву та області привеземо готовими до години. Самовивіз цілодобово — вул. Дегтярівська, 25-А, корпус 1. Оформлення свят, фотозон і вітрин магазинів робимо тільки в Києві.<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <sc-for list=\"{{ districts }}\" as=\"d\" hint-placeholder-count=\"10\">\n        <span style=\"display:inline-block;background:#FFFFFF;border:2px dashed #FFD9EA;border-radius:22px;padding:9px 18px;font-weight:700;font-size:14px;color:#53384A\">{{ d }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"yak-za 002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"position:relative;margin:0 0 6px;font-size:16px;font-weight:800;color:#53384A\">Підтвердимо за 10 хв<\u002Fh3>\n        <p style=\"position:relative;margin:0;font-size:14.5px;line-height:1.55;color:#6F5468\">Менеджер зателефонує, уточнить деталі, час і адресу доставки.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;background:#E8478D;border-radius:24px;padding:26px 22px;overflow:hidden;box-shadow:0 10px 26px rgba(232,71,141,0.35)\">\n        <span aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:6px;font-family:'Comfortaa',sans-serif;font-size:92px;font-weight:700;color:rgba(255,255,255,0.20);line-height:1\">04<\u002Fspan>\n        <span style=\"position:relative;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;margin-bottom:14px\">\n          <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"8\" rx=\"6\" ry=\"7\"><\u002Fellipse><path d=\"M12 17c-1.5 2 1.5 3 0 5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"position:relative;margin:0 0 6px;font-size:16px;font-weight:800;color:#FFFFFF\">Отримайте свято<\u002Fh3>\n        <p style=\"position:relative;margin:0;font-size:14.5px;line-height:1.55;color:#FFFFFF\">Курʼєр привезе кульки точно до години — або заберіть самовивозом 24/7.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"vidhuky\" data-screen-label=\"Відгуки\" style=\"padding:72px 20px;background:#FFF7EE;scroll-margin-top:120px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px\">\n      <div style=\"display:flex;flex-direction:column;ali n              <\u002Fdiv>\n              <span aria-label=\"Оцінка 5 з 5\" style=\"color:#F2B33D;font-size:14px;letter-spacing:1px;flex:none\">★★★★★<\u002Fspan>\n            <\u002Fdiv>\n            <blockquote style=\"margin:0;font-size:14.5px;line-height:1.6;color:#53384A;flex:1\">{{ r.text }}<\u002Fblockquote>\n          <\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"padding:72px 20px;scroll-margin-top:120px\">\n  <div style=\"max-width:820px;margin:0 auto\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:28px\">\n      <span style=\"display:inline-block;background:#DCEAFB;color:#2C5285;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;padding:6px 16px;border-radius:999px\">корисно знати<\u002Fspan>\n      <h2 style=\"margin:0;display:inline-block;background:#BFEBD5;color:#53384A;font-family:'Comfortaa',sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);padding:10px 26px;border-radius:999px\">Часті запитання<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"background:#FFFFFF;border:2px dashed #F5CFE0;border-radius:18px;overflow:hidden\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.open }}\" style=\"width:100%;background:none;border:none;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15.5px;font-weight:800;color:#53384A;cursor:pointer;text-align:left;min-height:44px\">\n            <span>{{ f.q }}<\u002Fspan>\n            <span aria-hidden=\"true\" style=\"color:#E8478D;font-size:20px;flex:none;transition:transform 0.2s;transform:rotate({{ f.deg }}deg)\">▾<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\" hint-placeh -size:32px\">📞<\u002Fdiv>\n          <p style=\"margin:0 0 6px;font-size:19px;font-weight:800;color:#0E9F8A\">Заявку прийнято!<\u002Fp>\n          <p style=\"margin:0 0 20px;font-size:14.5px;color:#6F5468;line-height:1.6\">Зателефонуємо на {{ cbSentPhone }} упродовж 10 хвилин.<\u002Fp>\n          <button sc-camel-on-click=\"{{ closeCallback }}\" style=\"background:#FF7BB5;color:#FFFFFF;border:none;border-radius:24px;padding:12px 30px;font-weight:800;font-size:15px;cursor:pointer\">Добре<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<style>\n@media (max-width: 720px){\n  .am-fab{padding:0 !important;width:58px !important;height:58px !important;border-radius:50% !important;justify-content:center !important;gap:0 !important}\n  .am-fab-label{display:none !important}\n}\n<\u002Fstyle>\n\n<sc-if value=\"{{ showTop }}\" hint-placeholder-val=\"{{ false }}\">\n  <button sc-camel-on-click=\"{{ scrollTop }}\" aria-label=\"Догори\" style=\"position:fixed;right:18px;bottom:18px;z-index:80;width:48px;height:48px;border-radius:50%;background:#FFFFFF;border:2px dashed #FF7BB5;color:#E8478D;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(255,123,181,0.30)\" style-hover=\"background:#FFD9EA\">↑<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Класичний по центру&quot;,&quot;Спліт: текст + кулі&quot;,&quot;Зелений святковий&quot;],&quot;default&quot;:&quot;Класичний по центру&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;promoBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      tab: 'all', search: '', cart: {}, cartOpen: false,\n      toast: '', justAdded: false, openFaq: 0,\n      name: '', phone: '', note: '', errName: '', errPhone: '',\n      sent: false, sentPhone: '', sentSummary: '', showTop: false\n    };\n    this._balloonsEl = null;\n    this._toastT = null;\n  }\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const s = window.scrollY > 600;\n      if (s !== this.state.showTop) this.setState({ showTop: s });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    clearTimeout(this._toastT);\n  }\n\n  allProducts() {\n    const base = 'https://aeromagic.ks.ua/files/Image/firs_page/';\n    return [\n      { id: 1, name: 'Фонтан із 10 гелієвих кульок «З Днем народження»', price: 659, old: 649, badge: 'Хіт', cat: 'helium', img: base + '195114748.jpg' },\n      { id: 2, name: 'Фольгована цифра з гелієм, 86 см (будь-яка)', price: 95, old: 0, badge: 'Хіт', cat: 'foil', img: base + '70.jpg_q50.jpg' },\n      { id: 3, name: 'Набір «Гендер-паті»: 25 кульок + банер «Boy or Girl?»', price: 94, old: 0, badge: 'Новинка', cat: 'sets', img: base + 'kompoziciya-sharov-na-gender-pati-malchik-ili-devochka-500x500.jpg' },\n      { id: 4, name: 'Фольговане серце червоне з гелієм, 45 см', price: 94, old: 249, badge: '−20%', cat: 'foil', img: base + 'kulki-sercya-na-zirku.jpg' },\n      { id: 5, name: 'Букет «Ніжність» — 15 латексних кульок у пастелі', price: 94, old: 0, badge: '', cat: 'helium', img: base + 'kulki-z-bantikami.jpg' },\n      { id: 6, name: 'Куля-сюрприз 60 см із дрібними кульками всередині', price: 94, old: 0, badge: 'Новинка', cat: 'sets', img: base + 'buket-z-povitryanuh-kulyok.jpg' },\n      { id: 7, name: 'Кульки Хром металік, набір 10 шт', price: 94, old: 0, badge: '', cat: 'helium', img: base + 'nabir-kulok-hrom-10-sht.jpg' },\n      { id: 8, name: 'Набір «Виписка з пологового» для хлопчика', price: 94, old: 1190, badge: 'Хіт', cat: 'sets', img: base + 'kulki-lateksni-riznokolorovi.jpg' }\n    ];\n  }\n\n  hrn(n) { return n.toLocaleString('uk-UA') + ' грн'; }\n\n  addToCart(id) {\n    const p = this.allProducts().find(x => x.id === id);\n    this.setState(s => {\n      const cart = Object.assign({}, s.cart);\n      cart[id] = (cart[id] || 0) + 1;\n      return { cart, toast: '«' + p.name + '» додано в кошик', justAdded: true };\n    });\n    clearTimeout(this._toastT);\n    this._toastT = setTimeout(() => this.setState({ toast: '', justAdded: false }), 2200);\n  }\n\n  changeQty(id, d) {\n    this.setState(s => {\n      const cart = Object.assign({}, s.cart);\n      const q = (cart[id] || 0) + d;\n      if (q <= 0) delete cart[id]; else cart[id] = q;\n      return { cart };\n    });\n  }\n\n  balloons() {\n    if (this._balloonsEl) return this._balloonsEl;\n    const cfg = [\n      { c: '#FF7BB5', l: '8%', t: '18%', s: 54, d: '0s', dur: '6s', o: 0.9 },\n      { c: '#BFEBD5', l: '20%', t: '55%', s: 38, d: '1.2s', dur: '7s', o: 0.85 },\n      { c: '#BBD8F7', l: '82%', t: '22%', s: 46, d: '0.6s', dur: '6.5s', o: 0.9 },\n      { c: '#FF7BB5', l: '90%', t: '60%', s: 32, d: '1.8s', dur: '8s', o: 0.55 },\n      { c: '#FFD9EA', l: '68%', t: '70%', s: 40, d: '0.9s', dur: '7.5s', o: 0.85 }\n    ];\n    this._balloonsEl = React.createElement(\n      'div',\n      { 'aria-hidden': true, style: { position: 'absolute', inset: 0, pointerEvents: 'none' } },\n      cfg.map((b, i) => React.createElement('div', {\n        key: i,\n        style: {\n          position: 'absolute', left: b.l, top: b.t, width: b.s + 'px', height: (b.s * 1.2) + 'px',\n          background: b.c, opacity: b.o, borderRadius: '50%',\n          animation: 'amFloat ' + b.dur + ' ease-in-out ' + b.d + ' infinite'\n        }\n      }, React.createElement('div', {\n        style: { position: 'absolute', left: '50%', top: '100%', width: '1.5px', height: (b.s * 0.8) + 'px', background: 'rgba(83,56,74,0.25)' }\n      })))\n    );\n    return this._balloonsEl;\n  }\n\n  cleanName(v) {\n    return v.replace(/[^A-Za-zА-Яа-яЇїІіЄєҐґ'ʼ\\-\\s]/g, '').replace(/\\s{2,}/g, ' ').slice(0, 60);\n  }\n  cleanPhone(v) {\n    let d = v.replace(/\\D/g, '');\n    if (d.slice(0, 3) === '380') d = '0' + d.slice(3);\n    else if (d.charAt(0) === '8' && d.length > 9) d = '0' + d.slice(1);\n    d = d.slice(0, 10);\n    if (d.length <= 3) return d;\n    if (d.length <= 6) return d.slice(0, 3) + ' ' + d.slice(3);\n    if (d.length <= 8) return d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6);\n    return d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6, 8) + ' ' + d.slice(8);\n  }\n  cleanEmail(v) {\n    return v.replace(/[^A-Za-z0-9@._\\-+]/g, '').slice(0, 100);\n  }\n  cleanNote(v) {\n    return v.replace(/[<>]/g, '').slice(0, 500);\n  }\n\n  submitOrder() {\n    const name = this.state.name.trim();\n    const phone = this.state.phone.replace(/[\\s\\-()]/g, '');\n    const errName = name.length >= 2 ? '' : 'Вкажіть, будь ласка, ваше імʼя';\n    const errPhone = /^(\\+?38)?0\\d{9}$/.test(phone) ? '' : 'Вкажіть номер у форматі 0XXXXXXXXX';\n    const email = (this.state.email || '').trim();\n    const errEmail = !email || /^[^@\\s]+@[^@\\s]+\\.[a-z]{2,}$/i.test(email) ? '' : 'Перевірте email';\n    if (errName || errPhone || errEmail) { this.setState({ errName, errPhone, errEmail }); return; }\n    const items = this.cartList();\n    const total = items.reduce((a, x) => a + x.sum, 0);\n    const summary = items.length\n      ? 'У замовленні: ' + items.map(x => x.name + ' × ' + x.qty).join('; ') + ' — разом ' + this.hrn(total) + '.'\n      : 'Замовлення без товарів — підберемо все під час дзвінка.';\n    try {\n      fetch('/api/crm-order', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({\n          type: items.length ? 'order' : 'callback',\n          source: 'aeromagic.kyiv.ua (головна)',\n          orderNo: 'AM-' + Math.floor(100000 + Math.random() * 899999),\n          amount: total,\n          client: { name: name, phone: this.state.phone, email: email },\n          note: this.state.note,\n          items: items.map(x => ({ name: x.name, price: Math.round(x.sum / x.qty), qty: x.qty })),\n          createdAt: new Date().toISOString()\n        })\n      }).catch(() => {});\n    } catch (e) {}\n    this.setState({ sent: true, sentPhone: this.state.phone, sentSummary: summary, errName: '', errPhone: '', errEmail: '', cart: {}, cartOpen: false });\n  }\n\n  cartList() {\n    const all = this.allProducts();\n    return Object.keys(this.state.cart).map(id => {\n      const p = all.find(x => x.id === Number(id));\n      const qty = this.state.cart[id];\n      return { id: p.id, name: p.name, qty, sum: p.price * qty };\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const heroOpt = this.props.heroVariant ?? 'Класичний по центру';\n    const q = s.search.trim().toLowerCase();\n    const base = 'https://aeromagic.ks.ua/files/Image/firs_page/';\n    const chips = ['#FFD9EA', '#DDF3E9', '#DCEAFB'];\n    const tabDefs = [\n      { key: 'all', label: 'Усі' }, { key: 'helium', label: 'Гелієві' },\n      { key: 'foil', label: 'Фольговані' }, { key: 'sets', label: 'Набори' }\n    ];\n    const products = this.allProducts()\n      .filter(p => (s.tab === 'all' || p.cat === s.tab) && (!q || p.name.toLowerCase().includes(q)))\n      .map(p => ({\n        name: p.name, img: p.img,\n        priceStr: this.hrn(p.price),\n        hasOld: p.old > 0, oldStr: p.old > 0 ? this.hrn(p.old) : '',\n        hasBadge: !!p.badge, badge: p.badge,\n        badgeBg: p.badge === 'Новинка' ? '#BFEBD5' : '#FF7BB5',\n        badgeColor: p.badge === 'Новинка' ? '#53384A' : '#FFFFFF',\n        add: () => this.addToCart(p.id)\n      }));\n    const cartItems = this.cartList().map(ci => ({\n      name: ci.name, qty: ci.qty, sumStr: this.hrn(ci.sum),\n      inc: () => this.changeQty(ci.id, 1), dec: () => this.changeQty(ci.id, -1)\n    }));\n    const cartCount = Object.values(s.cart).reduce((a, b) => a + b, 0);\n    const cartTotal = this.cartList().reduce((a, x) => a + x.sum, 0);\n    const faqData = [\n      { q: 'Скільки літають гелієві кульки?', a: 'Латексні з обробкою Hi-Float — від 3 до 7 діб, фольговані фігури — від 5 до 14 діб. Гелій у нас завжди свіжий, тож кульки не «сумують» уже наступного ранку.' },\n      { q: 'Чи можна доставити на конкретну годину?', a: 'Так, це наша фішка. Курʼєр приїде точно до узгодженої години — навіть о 6-й ранку, якщо хочете зробити сюрприз до пробудження.' },\n      { q: 'Які способи оплати?', a: 'Готівкою курʼєру або при самовивозі, карткою, або за реквізитами на ФОП. Для передоплати надішлемо посилання на оплату.' },\n      { q: 'Яка мінімальна сума замовлення?', a: 'Мінімальної суми немає — замовляйте хоч одну кульку. Безкоштовна доставка по Києву від 1500 грн — інакше 150 грн по місту.' },\n      { q: 'Чи оформлюєте зали та фотозони?', a: 'Так, робимо оформлення під ключ: фотозони, арки з кульок, декор залів і вітрин магазинів. Виїзд лише по Києву та області — в інші міста надсилаємо готові набори, які легко зібрати самостійно.' },\n      { q: 'Ви доставляєте в інші міста?', a: 'Так. Набір із балоном гелію, кульками та інструкцією надсилаємо Новою Поштою по всій Україні — надуєте вдома за 10–15 хвилин. Надуті гелієві кульки перевізник не приймає, тому по Україні їдуть саме набори.' }\n    ];\n    const eventNames = ['День народження', 'Гендер-паті', 'Виписка з пологового', 'Річниця', 'Випускний', 'Дівич-вечір', 'Корпоратив'];\n    const evBorders = ['#FF7BB5', '#5FAE8C', '#7FA8DC'];\n    const evHovers = ['#FFD9EA', '#DDF3E9', '#DCEAFB'];\n    return {\n      promoBarOn: this.props.promoBar ?? true,\n      heroClassic: heroOpt === 'Класичний по центру',\n      heroSplit: heroOpt === 'Спліт: текст + кулі',\n      heroGreen: heroOpt === 'Зелений святковий',\n      heroBalloons: this.balloons(),\n      search: s.search,\n      onSearch: e => this.setState({ search: e.target.value }),\n      categories: [\n        { name: 'Набори для чоловіків', img: base + '22222.jpg', href: 'katalog.html#sets' },\n        { name: 'Набори для жінок', img: base + '195114748.jpg', href: 'katalog.html#sets' },\n        { name: 'Набори для дітей', img: base + 'minni-maus-750x750-product_thumb.jpg', href: 'katalog.html#sets' },\n        { name: 'Букети з кульок', img: base + 'buket-z-povitryanuh-kulyok.jpg', href: 'katalog.html#bouquets' },\n        { name: 'Цифри, літери, фрази', img: base + '70.jpg_q50.jpg', href: 'katalog.html#foil-numbers' },\n        { name: 'Ходячі кульки', img: base + 'khodyachiye_shary.jpg', href: 'katalog.html#foil-figures' },\n        { name: 'Фігури та квіти з кульок', img: base + 'maxresdefault.jpg', href: 'katalog.html#foil-figures' },\n        { name: 'Фотозони з куль', img: base + 'fotozona-z-kulyok.jpg', href: 'katalog.html#sets' },\n        { name: 'Гендер-паті', img: base + 'kompoziciya-sharov-na-gender-pati-malchik-ili-devochka-500x500.jpg', href: 'katalog.html#gender' },\n        { name: 'Кульки з бантиками', img: base + 'kulki-z-bantikami.jpg', href: 'katalog.html#latex-print' },\n        { name: 'Кульки Хром', img: base + 'nabir-kulok-hrom-10-sht.jpg', href: 'katalog.html#chrome' },\n        { name: 'Ваш напис на кульках', img: base + 'kulki-z-individualnimi-napisami.jpg', href: 'katalog.html#latex-print' }\n      ].map((c, i) => Object.assign(c, { chip: chips[i % 3] })),\n      tabs: tabDefs.map(t => ({\n        label: t.label, active: s.tab === t.key,\n        border: s.tab === t.key ? '#E8478D' : '#F5CFE0',\n        bg: s.tab === t.key ? '#E8478D' : '#FFFFFF',\n        color: s.tab === t.key ? '#FFFFFF' : '#6F5468',\n        pick: () => this.setState({ tab: t.key })\n      })),\n      products, hasProducts: products.length > 0, noProducts: products.length === 0,\n      districts: ['Шевченківський','Печерський','Подільський','Святошинський','Солом\\'янський','Оболонський','Голосіївський','Дніпровський','Дарницький','Деснянський','Київська область'],\n      events: eventNames.map((name, i) => ({ name, border: evBorders[i % 3], hoverBg: evHovers[i % 3] })),\n      reviews: [\n        { name: 'Оксана Литвин', initial: 'О', bg: '#FFD9EA', accent: '#E8478D', img: base + '195114748.jpg', text: 'Замовляла фонтан із кульок доньці на 8 років. Привезли о 7 ранку, як і просила — дитина прокинулась і верещала від щастя. Кульки літали більше тижня!' },\n        { name: 'Андрій Коваленко', initial: 'А', bg: '#DCEAFB', accent: '#2C5285', img: base + '70.jpg_q50.jpg', text: 'Брав цифри на ювілей дружини. Швидко, акуратно, гелій тримає. Окремий плюс — передзвонили за 5 хвилин після замовлення.' },\n        { name: 'Марина Шевчук', initial: 'М', bg: '#DDF3E9', accent: '#1E6A50', img: base + 'kompoziciya-sharov-na-gender-pati-malchik-ili-devochka-500x500.jpg', text: 'Оформлювали гендер-паті. Набір виглядав навіть краще, ніж на фото, а банер став хітом вечора. Дякую за уважність до дрібниць!' },\n        { name: 'Сергій Мельник', initial: 'С', bg: '#FCE0CF', accent: '#9A4E20', img: base + 'fotozona-z-kulyok.jpg', text: 'Замовляв фотозону на корпоратив. Приїхали, змонтували, все чітко по часу. Колеги досі згадують. Рекомендую.' }\n      ],\n      faqs: faqData.map((f, i) => ({\n        q: f.q, a: f.a, open: s.openFaq === i,\n        deg: s.openFaq === i ? 180 : 0,\n        toggle: () => this.setState({ openFaq: s.openFaq === i ? -1 : i })\n      })),\n      cartOpen: s.cartOpen,\n      toggleCart: () => this.setState({ cartOpen: !s.cartOpen }),\n      closeCartToOrder: () => this.setState({ cartOpen: false }),\n      cartItems, cartEmpty: cartItems.length === 0,\n      cartCount, hasCart: cartCount > 0,\n      cartBadgeStyle: 'position:absolute;top:-6px;right:-6px;background:#BFEBD5;color:#53384A;font-size:12px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;' + (s.justAdded ? 'animation:amPop 0.4s ease' : ''),\n      cartTotalStr: this.hrn(cartTotal),\n      formName: s.name, onName: e => this.setState({ name: this.cleanName(e.target.value) }),\n      formPhone: s.phone, onPhone: e => this.setState({ phone: this.cleanPhone(e.target.value) }),\n      formNote: s.note, onNote: e => this.setState({ note: this.cleanNote(e.target.value) }),\n      errName: s.errName, hasErrName: !!s.errName,\n      errPhone: s.errPhone, hasErrPhone: !!s.errPhone,\n      formEmail: s.email || '', onEmail: e => this.setState({ email: this.cleanEmail(e.target.value) }),\n      errEmail: s.errEmail || '', hasErrEmail: !!s.errEmail,\n      submitOrder: () => this.submitOrder(),\n      sent: s.sent, notSent: !s.sent, sentPhone: s.sentPhone, sentSummary: s.sentSummary,\n      fabOpen: !!s.fabOpen,\n      toggleFab: () => this.setState(st => ({ fabOpen: !st.fabOpen })),\n      callbackOpen: !!s.cbOpen,\n      openCallback: () => this.setState({ cbOpen: true, cbSent: false, cbErr: '', fabOpen: false }),\n      closeCallback: () => this.setState({ cbOpen: false }),\n      cbName: s.cbName || '', onCbName: e => this.setState({ cbName: e.target.value }),\n      cbPhone: s.cbPhone || '', onCbPhone: e => this.setState({ cbPhone: e.target.value }),\n      cbErr: s.cbErr || '', hasCbErr: !!s.cbErr,\n      cbSent: !!s.cbSent, cbNotSent: !s.cbSent, cbSentPhone: s.cbSentPhone || '',\n      submitCallback: () => {\n        const ph = (this.state.cbPhone || '').replace(/[\\s\\-()]/g, '');\n        if (!/^(\\+?38)?0\\d{9}$/.test(ph)) { this.setState({ cbErr: 'Вкажіть номер у форматі 0XXXXXXXXX' }); return; }\n        this.setState({ cbSent: true, cbSentPhone: this.state.cbPhone, cbErr: '' });\n      },\n      toastOn: !!s.toast, toastText: s.toast,\n      showTop: s.showTop,\n      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
